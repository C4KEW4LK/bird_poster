[project]
name = "birdposter"
version = "1.0.0"
description = "Build and deploy tooling for the ESP32-S3 e-ink bird poster: the browser flasher, font subsetting and the full-size web plates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.50",
]

# Not a package: the device runs the firmware, and the tooling here is run as
# `python firmware/tools/<name>.py`. This file pins their dependencies and the
# checks CI runs. The artwork pipeline that bakes the packs is workstation-only
# and not in the repository.

[tool.uv]
package = false

[tool.ruff]
line-length = 100  # what the code was already written to; 88 would rewrap a third of it
extend-exclude = ["notes"]  # research logs, not linted

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4"]
isort.combine-as-imports = true  # one line per module, aliases and all
ignore = ["BLE001", "DTZ011"]

[tool.mypy]
python_version = "3.12"
files = ["firmware/tools/webflash.py", "firmware/tools/subset_font.py", "firmware/tools/export_web_plates.py"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["fontTools", "fontTools.*"]
ignore_missing_imports = true



[dependency-groups]
dev = [
    "mypy>=1.15",
    "ruff>=0.14",
]
