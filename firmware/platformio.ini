; Bird poster: ESP32-S3 port (docs/IMPLEMENTATION.md).
;
; Two environments. `native` compiles the packer and the renderer as ordinary
; desktop code and writes a page to a file, so layout and dither work is a
; one-second loop instead of flash-and-squint. `xiao` is the frame itself:
; the same libraries plus the panel driver, WiFi, the web UI and the sleep
; loop, for the XIAO ESP32-S3 Plus seated in Seeed's EE02 with the 13.3"
; Spectra 6 panel.
;
; Shared code lives in lib/ and is Arduino-free wherever it can be - packer,
; source, plates, render - so `pio test -e native` covers the URL building, the
; JSON parsing, the ranking and the packing without a radio. Only lib/panel and
; src/device are Arduino.
;
; The plates and the label font ride in a LittleFS image, built from
; firmware/data/ by `pio run -e xiao -t uploadfs`:
;   .venv-rembg/bin/python firmware/tools/bake_plates.py firmware/data/plates.bin --count 0
;   cp assets/fonts/gentiumbookplus/GentiumBookPlus-Italic.ttf firmware/data/label.ttf
; or in one go, with a browser flasher around it: firmware/tools/webflash.py.

[platformio]
default_envs = native

[env]
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11
; ArduinoJson is header-only and platform-agnostic, so the same parser runs in
; the host tests and on the board. 7.x is the JsonDocument API used in lib/source.
lib_deps = bblanchon/ArduinoJson@^7.0
; lib/render includes lib/plates includes lib/packer: let the dependency finder
; follow includes through libraries, not just from src.
lib_ldf_mode = deep

[env:native]
platform = native
build_src_filter = -<*> +<native/>
test_framework = unity

[env:xiao]
; Pinned: the firmware is written against Arduino-ESP32 3.x (NetworkClientSecure,
; the 3.x WiFi and HTTP APIs), which PlatformIO's own espressif32 platform does
; not ship - an unpinned `espressif32` resolves there to Arduino 2.0.x and the
; build fails. pioarduino's 53.03.13 is Arduino-ESP32 3.1.3.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = -<*> +<device/>
monitor_speed = 115200
; The 8 MB PSRAM is the whole reason this board was chosen: the canvas, the
; frame, the occupancy grid and the sprites do not fit in internal SRAM.
board_build.arduino.memory_type = qio_opi
; The stock XIAO ESP32S3 is an 8 MB part and the board file says so; the plate
; image needs the 16 MB one (XIAO ESP32S3 Plus, which is what the EE02 wants).
; On an 8 MB board bake with --count and a subset.
board_upload.flash_size = 16MB
board_build.partitions = partitions-plates-16mb.csv
; LittleFS, not SPIFFS: SPIFFS scans the whole partition on mount, and at 14 MB
; that is a cost paid on every wake.
board_build.filesystem = littlefs
; The version is the commit, "-dirty" when the tree has changes not in it,
; and the build's time (YYMMDDhhmm) - so two builds of one commit can still be
; told apart on the status page. webflash.py sets BUILD_STAMP once, so every
; board it builds carries the same one. The time is in the flags, so a build
; in a new minute recompiles everything.
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    !echo '-DFIRMWARE_VERSION=\\"'$(git rev-parse --short HEAD 2>/dev/null || echo dev)$(git diff --quiet HEAD -- . 2>/dev/null || echo -dirty).${BUILD_STAMP:-$(date +%%y%%m%%d%%H%%M)}'\\"'

; The reTerminal E1004: the same panel and MCU class behind different pins,
; with 32 MB of flash. One build of the same sources with the E1004 pin map
; selected, and a plates partition that holds every regional pack at once.
[env:e1004]
extends = env:xiao
board_upload.flash_size = 32MB
board_build.partitions = partitions-plates-32mb.csv
build_flags =
    ${env:xiao.build_flags}
    -DBOARD_E1004

; Debug builds: the same firmware plus the memory stress test (`/api/stress`,
; see App::stressTest) and "-debug" on the version. `webflash.py --debug`
; builds these in place of the ordinary ones.
[env:xiao-debug]
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -DBIRDPOSTER_DEBUG

[env:e1004-debug]
extends = env:e1004
build_flags =
    ${env:e1004.build_flags}
    -DBIRDPOSTER_DEBUG
